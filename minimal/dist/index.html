<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>节点监控</title>
<link rel="icon" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
:root{
  --bg:#f6f7f9; --fg:#1a1a1a; --muted:#6b7280; --line:#e6e8eb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --dim:#9ca3af;
  --accent:#2563eb; --okbg:#f0fdf4; --warnbg:#fffbeb; --badbg:#fef2f2;
}
html[data-theme="dark"]{
  --bg:#0a0a0a; --fg:#f5f5f5; --muted:#9ca3af; --line:#242424; --card:#111214;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --dim:#6b7280;
  --accent:#60a5fa; --okbg:#052e16; --warnbg:#451a03; --badbg:#450a0a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 56px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* 顶栏 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:20px;height:20px;display:block;flex:none}
.site{font-size:17px;font-weight:600;letter-spacing:-.2px}
.counts{margin-left:auto;display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.counts b{color:var(--fg);font-weight:600}
.counts .off b{color:var(--bad)}
/* 深浅色切换 */
.tgl{width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer;
  padding:0;transition:color .15s,border-color .15s}
.tgl:hover{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tgl svg{width:16px;height:16px;display:block}

/* 公告 */
.notice{margin:14px 0 0;padding:9px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--fg);font-size:13px}

.sec-head{display:flex;align-items:baseline;gap:10px;margin:12px 0 9px}
.sec-head h2{margin:0;font-size:14px;font-weight:600}
.sec-head .meta{font-size:12px;color:var(--muted);margin-left:auto}

/* ===== 卡片网格（紧凑） ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:10px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 1px 0 color-mix(in srgb,var(--fg) 4%,transparent)}
.card.off{opacity:.82}

/* 卡头 */
.chead{display:flex;align-items:center;gap:8px;min-width:0}
.os-ic{display:inline-flex;width:18px;height:18px;flex:none}
.os-ic svg{width:100%;height:100%;display:block}
html[data-theme="dark"] .os-ic.dark{color:var(--fg)!important}
.ctitle{min-width:0;flex:1}
.ctitle .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.ctitle .nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;flex:none;line-height:15px}
.ctitle .rm{font-size:11px;color:var(--muted);margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cstat{display:inline-flex;align-items:center;gap:5px;font-size:12px;flex:none;white-space:nowrap}
.cstat .sub{color:var(--bad);font-size:10.5px;margin-left:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}

/* 资源条 + 延迟色带（统一 42px 标签 / 46px 数值 / 8px 间距，列左边右边严格对齐）*/
.cbody{display:flex;flex-direction:column;gap:9px}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:42px 1fr 46px;align-items:center;column-gap:8px;font-size:11.5px}
.brow .bk{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:5px;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--accent);width:0;transition:width .3s}
.fill.hi{background:var(--warn)}.fill.max{background:var(--bad)}
.brow .bv{text-align:right;color:var(--fg);font-size:11px}
.brow .bv.dim{color:var(--dim)}

/* 卡底信息：统一 42px 标签 / 46px 数值 / 8px 间距，与资源条逐列对齐 */
.cmeta{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);
  padding-top:8px;margin-top:auto;font-size:11.5px}
/* 流量 / 到期（标签列 42px，与上方一致）*/
.mrow{display:grid;grid-template-columns:42px 1fr;column-gap:8px;align-items:baseline}
.mrow .k{color:var(--muted);font-size:11px}
.mrow .v{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .v .sep{color:var(--dim);margin:0 4px}
/* 延迟热力色带：标签列(线路名)42px / 色带 1fr / 数值 46px，与 CPU 条逐列对齐 */
.lrow{display:grid;grid-template-columns:42px 1fr 46px;column-gap:8px;align-items:center;min-width:0}
.lrow .dot{display:block;width:9px;height:9px;border-radius:3px;background:var(--dim)}
.heat{display:flex;gap:1px;height:9px;border-radius:3px;overflow:hidden;
  background:color-mix(in srgb,var(--fg) 6%,transparent)}
.hc{flex:1 1 0;min-width:0}
.lrow .lv{font-size:11px;text-align:right}
.lv.ok{color:var(--fg)}.lv.warn{color:var(--warn)}.lv.bad{color:var(--bad)}.lv.none{color:var(--dim)}
.exp-ok{color:var(--fg)}.exp-soon{color:var(--warn)}.exp-expd{color:var(--bad)}.exp-never{color:var(--dim)}

/* 错误 / 空态 */
.err{margin:14px 0;padding:12px 14px;border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));
  background:var(--badbg);color:var(--bad);border-radius:8px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}

/* ===== 详情页 ===== */
.detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;
  padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  text-decoration:none;white-space:nowrap}
.back:hover{color:var(--fg);border-color:var(--accent);text-decoration:none}
.back:visited,.back:link{text-decoration:none;color:var(--muted)}
.detail-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:9px}
.detail-title .rm{font-weight:400;font-size:12px;color:var(--muted)}
.detail-meta{font-size:12px;color:var(--muted);margin-left:auto}
/* 统一线框图标（返回 / 章节 / 指标卡 / 图例）—— 与顶栏深浅色按钮同一套 stroke 风格 */
.ic{flex:none;display:inline-block;width:15px;height:15px}
.back .ic{color:var(--fg)}
.dsec .dic{color:var(--accent);display:inline-flex}
.dsec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dsec .sp{margin-left:auto}
.dcard .k{display:flex;align-items:center;gap:5px}
.dcard .k .kic{color:var(--muted);display:inline-flex}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.legend i{font-style:normal}
.legend .ldot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dlat-card .pn{display:flex;align-items:center}
.dlat-card .ldot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;flex:none}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dcard .k{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.dcard .v{font-size:18px;font-weight:600;margin-top:4px}
.dcard .v small{font-size:12px;color:var(--muted);font-weight:400}
.dsec{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;margin:18px 0 9px}
.dsec .sp{margin-left:auto}
/* 时间范围切换 */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;
  padding:4px 11px;cursor:pointer;border-right:1px solid var(--line)}
.tabs button:last-child{border-right:0}
.tabs button:hover{color:var(--fg)}
.tabs button.active{background:var(--accent);color:#fff}
.dlats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dlat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.dlat-card .pn{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlat-card .pv{font-size:22px;font-weight:600;margin-top:2px}
.dlat-card .pv.warn{color:var(--warn)}.dlat-card .pv.bad{color:var(--bad)}.dlat-card .pv.none{color:var(--dim)}
.dlat-card .loss{font-size:11px;color:var(--dim);margin-top:2px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chartbox.wide{grid-column:1 / -1}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chartbox .ct{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.chartbox .ct .cur{color:var(--fg);font-weight:600;font-size:13px}
.chartbox svg{width:100%;height:110px;display:block;margin-top:6px}
.chartbox .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:3px}
.legend{font-size:11px;color:var(--muted);margin-top:5px}
.legend i{font-style:normal;margin-right:12px}
.dlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ditem{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--card)}
.ditem .l{color:var(--muted);white-space:nowrap}.ditem .v{font-weight:500;color:var(--fg);text-align:right;max-width:62%;word-break:break-word}
@media(max-width:720px){.dgrid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}

/* 页脚 */
.foot{margin-top:26px;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.foot .dotp{display:inline-flex;align-items:center;gap:6px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pulse.stale{background:var(--warn)}
@media(prefers-reduced-motion:reduce){.pulse{animation:none!important}}
.pulse{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div id="listView">
    <header class="top">
      <div class="brand">
        <img class="logo" src="/favicon.svg" alt="" onerror="this.style.display='none'" />
        <span class="site" id="site">节点监控</span>
      </div>
      <div class="counts" id="counts"></div>
      <button class="tgl" id="themeBtn" type="button" onclick="toggleTheme()" title="切换深浅色" aria-label="切换深浅色"></button>
    </header>

    <div class="notice" id="notice" hidden></div>

    <div class="sec-head">
      <h2>节点</h2>
      <span class="meta" id="meta"></span>
    </div>
    <div class="cards" id="cards"></div>

    <div class="err" id="err" hidden></div>
  </div><!-- /listView -->

  <!-- 节点详情（客户端路由 /node/{id}） -->
  <section id="detail" style="display:none">
    <div class="detail-head">
      <a class="back" href="javascript:void(0)" onclick="backToList()"><svg class='ic' viewBox='0 0 24 24' width='15' height='15' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 12H5M12 19l-7-7 7-7'/></svg>全部节点</a>
      <div class="detail-title" id="dtitle"></div>
      <span class="detail-meta" id="dmeta"></span>
    </div>
    <div id="dbody"></div>
  </section>

  <footer class="foot">
    <span class="dotp"><span class="pulse" id="pulse"></span><span id="live">已连接</span></span>
    <span>刷新于 <span id="upd">—</span></span>
  </footer>
</div>

/* 发行版识别 */
function osKey(os){
  if(!os) return "linux";
  var o=os.toLowerCase();
  if(/debian|bookworm|bullseye|trixie/.test(o)) return "debian";
  if(/ubuntu/.test(o)) return "ubuntu";
  if(/red ?hat|rhel/.test(o)) return "redhat";
  if(/rocky/.test(o)) return "rocky";
  if(/almalinux|alma/.test(o)) return "alma";
  if(/centos/.test(o)) return "centos";
  if(/fedora/.test(o)) return "fedora";
  if(/arch|manjaro|endeavour/.test(o)) return "arch";
  if(/alpine/.test(o)) return "alpine";
  if(/opensuse|sles|suse/.test(o)) return "suse";
  if(/gentoo/.test(o)) return "gentoo";
  if(/amazon|aws/.test(o)) return "amazon";
  if(/oracle/.test(o)) return "oracle";
  if(/windows/.test(o)) return "windows";
  if(/freebsd/.test(o)) return "bsd";
  if(/macos|darwin|os x/.test(o)) return "macos";
  return "linux";
}
function osIcon(os){
  var k=osKey(os), ic=OS_ICONS[k]||OS_ICONS.linux;
  return {key:k, label:ic.label, color:ic.color, dark:ic.dark, d:ic.d};
}
function osSvg(os){
  var ic=osIcon(os);
  return "<span class='os-ic"+(ic.dark?" dark":"")+"' style='color:"+ic.color+"' title='"+esc(ic.label+" · "+(os||"未知"))+"'>"+
    "<svg viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='"+ic.d+"'/></svg></span>";
}

/* ===== 纯格式化 ===== */
function humanBytes(n){
  if(n==null||!isFinite(n)) return "—";
  var u=["B","KB","MB","GB","TB","PB"],i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (i===0?Math.round(n):n.toFixed(n>=100?0:1))+" "+u[i];
}
function humanRate(n){ return n==null||!isFinite(n)?"—":humanBytes(n)+"/s"; }
function expireInfo(node){
  if(node.expires_in!=null){
    var d=node.expires_in;
    if(d<0)  return {cls:"exp-expd", txt:"已过期 "+Math.abs(d)+" 天"};
    if(d===0)return {cls:"exp-expd", txt:"今天到期"};
    if(d<=7) return {cls:"exp-soon", txt:d+" 天后到期"};
    if(d<=30)return {cls:"exp-soon", txt:d+" 天后到期"};
    return {cls:"exp-ok", txt:d+" 天后到期"};
  }
  if(node.expires_at){
    var days=Math.ceil((new Date(node.expires_at).getTime()-Date.now())/86400000);
    if(isFinite(days))return {cls:days<=0?"exp-expd":"exp-ok", txt:days<=0?"已过期":days+" 天后到期"};
  }
  return {cls:"exp-never", txt:"长期有效"};
}
function cycleLabel(c){
  if(!c) return "";
  var named={monthly:"月",quarterly:"季",semiannual:"半年",yearly:"年",biennial:"两年",triennial:"三年"};
  if(c==="once") return "一次性";
  if(named[c]) return named[c];
  var m=/^(\d+)m$/.exec(c); if(m) return m[1]+" 个月";
  return c;
}
function offlineAgo(sec){
  if(sec==null||sec<=0) return "";
  var h=Math.floor(sec/3600),mi=Math.floor((sec%3600)/60);
  if(h>0) return "离线 "+h+" 小时";
  if(mi>0) return "离线 "+mi+" 分钟";
  return "离线 "+Math.max(1,Math.round(sec))+" 秒";
}
/* 仅时长，不带「离线」前缀（卡片状态已写「离线」） */
function agoText(sec){
  if(sec==null||sec<=0) return "";
  var h=Math.floor(sec/3600),mi=Math.floor((sec%3600)/60);
  if(h>0) return h+" 小时";
  if(mi>0) return mi+" 分钟";
  return Math.max(1,Math.round(sec))+" 秒";
}
function money(amount,currency){
  if(amount==null||!isFinite(amount)||!currency) return null;
  try{return new Intl.NumberFormat("zh-CN",{style:"currency",currency:currency,maximumFractionDigits:2}).format(amount);}
  catch(e){return currency+" "+amount.toFixed(2);}
}
/* 按探测线路(task_id)分组：返回每条线路的最新延迟 + 完整时序（供热力色带/图表用） */
function lastLatencyByProbe(ping, probeNames){
  if(!ping||!ping.length) return [];
  var byTask={},order=[];
  for(var j=0;j<ping.length;j++){
    var k=ping[j].task_id;
    if(order.indexOf(k)===-1){order.push(k);byTask[k]=[];}
    byTask[k].push(ping[j]);
  }
  return order.slice(0,3).map(function(kk){
    var arr=byTask[kk].slice().sort(function(a,b){return a.ts-b.ts;});
    var last=null;
    for(var m=arr.length-1;m>=0;m--){ if(arr[m].latency!=null){ last=arr[m].latency; break; } }
    return {task:kk, name:(probeNames&&probeNames[kk])?probeNames[kk]:("线路 "+kk), latency:last, series:arr};
  });
}
/* 延迟 → 热力色（无数据=浅灰） */
function heatColor(lat){
  if(lat==null) return "color-mix(in srgb,var(--fg) 10%,transparent)";
  if(lat<50)  return "#16a34a";
  if(lat<90)  return "#65a30d";
  if(lat<130) return "#eab308";
  if(lat<180) return "#f97316";
  return "#ef4444";
}
function hhmm(ts){
  var d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
/* 一条热力色带：对时序做均匀降采样，固定 N 格（主界面用 24 格，清爽不密集） */
function heatBand(series, maxCells){
  if(!series||!series.length) return "<span class='heat'></span>";
  var N=maxCells||24;
  var pick=series;
  if(series.length>N){
    // 均匀抽样 N 个下标（含首末），避免 169px 塞满几十格太密
    var step=(series.length-1)/(N-1), out=[];
    for(var s=0;s<N;s++){ out.push(series[Math.round(s*step)]); }
    pick=out;
  }
  var cells=pick.map(function(r){
    var t=hhmm(r.ts);
    var tip=t+" · "+(r.latency!=null?Math.round(r.latency)+" ms":"无响应")+(r.loss?" · 丢包 "+Number(r.loss).toFixed(0)+"%":"");
    return "<span class='hc' style='background:"+heatColor(r.latency)+"' title='"+esc(tip)+"'></span>";
  }).join("");
  return "<span class='heat'>"+cells+"</span>";
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ===== 状态 ===== */
var state={site:"",notice:"",nodes:[],probeNames:{},probeLat:{},wsLive:false,err:"",view:"list",detailId:null,range:6};

function showView(v){
  document.getElementById("listView").style.display=(v==="list")?"":"none";
  document.getElementById("detail").style.display=(v==="detail")?"block":"none";
}
function showList(){ state.view="list"; showView("list"); }
function openDetail(id){
  state.view="detail"; state.detailId=id; showView("detail");
  history.pushState({detail:id},"","/node/"+id);
  renderDetail();
}
function backToList(){ showList(); history.pushState({}, "", "/"); }

/* ===== 渲染：主界面卡片 ===== */
function renderNotice(){
  var el=document.getElementById("notice");
  if(state.notice){el.textContent=state.notice;el.hidden=false;} else el.hidden=true;
}
function renderCounts(){
  var on=0,off=0;
  state.nodes.forEach(function(n){n.online?on++:off++;});
  document.getElementById("counts").innerHTML=
    "<span>共 <b>"+state.nodes.length+"</b> 节点</span><span>在线 <b>"+on+"</b></span>"+
    (off?'<span class="off">离线 <b>'+off+"</b></span>":"");
}
function renderMeta(){
  document.getElementById("meta").textContent=state.nodes.length+" 个节点 · "+new Date().toLocaleTimeString("zh-CN");
}
function barRow(label, pct, value){
  if(pct==null) return "<div class='brow'><span class='bk'>"+label+"</span><div class='track'></div><span class='bv dim'>—</span></div>";
  var cls=pct>90?"max":(pct>70?"hi":"");
  return "<div class='brow'><span class='bk'>"+label+"</span>"+
    "<div class='track'><div class='fill "+cls+"' style='width:"+Math.min(100,pct).toFixed(1)+"%'></div></div>"+
    "<span class='bv'>"+Math.round(pct)+"%</span></div>";
}
function nodeCard(n){
  var m=n.metrics||{};
  var online=!!(n.online&&n.metrics);
  var st = online
    ? "<span class='dot on'></span>在线"
    : "<span class='dot off'></span>离线"+(n.last_seen_ago!=null?"<span class='sub'>"+esc(agoText(n.last_seen_ago))+"</span>":"");
  var cpuPct=(m.cpu!=null)?Math.max(0,Math.min(100,m.cpu)):null;
  var memPct=(m.mem_used!=null&&m.mem_total)?m.mem_used/m.mem_total*100:null;
  var diskPct=(m.disk_used!=null&&m.disk_total)?m.disk_used/m.disk_total*100:null;
  var bars="<div class='bars'>"+
    barRow("CPU",cpuPct, m.cpu)+
    barRow("内存",memPct, m.mem_used)+
    barRow("硬盘",diskPct, m.disk_used)+
  "</div>";
  // 延迟热力色带（3 网）—— 与上方资源条逐列对齐
  var latRows="";
  var byProbe=state.probeLat[n.id];
  if(byProbe&&byProbe.length){
    latRows=byProbe.map(function(p,idx){
      var cls=p.latency==null?"none":(p.latency>=150?"bad":(p.latency>=80?"warn":"ok"));
      var dot=(typeof PROBE_COLORS!=="undefined")?PROBE_COLORS[idx%3]:"var(--dim)";
      return "<div class='lrow'><span class='dot' style='background:"+dot+"' title='"+esc(p.name)+"'></span>"+
        heatBand(p.series)+
        "<span class='lv "+cls+"'>"+(p.latency!=null?Math.round(p.latency):"—")+"</span></div>";
    }).join("");
  }else{
    latRows="<div class='lrow'><span class='dot' style='background:var(--dim)'></span><span class='heat'></span><span class='lv none'>—</span></div>";
  }
  var latBlock="<div class='latblock'>"+latRows+"</div>";
  var flowV = (n.total_rx!=null||n.total_tx!=null)
    ? "↓"+esc(humanBytes(n.total_rx||0))+"<span class='sep'>·</span>↑"+esc(humanBytes(n.total_tx||0))

/* ===== 详情页 ===== */
function sparkline(points, color){
  if(!points||points.length<2) return "<div class='empty' style='padding:16px 0'>数据不足</div>";
  var W=600,H=140,P=8;
  var vs=points.map(function(p){return p[1];});
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  if(hi===lo) hi=lo+1;
  var range=hi-lo;
  var xs=function(i){return P+(i/(points.length-1))*(W-2*P);};
  var ys=function(v){return H-P-((v-lo)/range)*(H-2*P);};
  var path=points.map(function(p,i){return (i?"L":"M")+xs(i).toFixed(1)+" "+ys(p[1]).toFixed(1);}).join(" ");
  var area=path+" L"+xs(points.length-1).toFixed(1)+" "+(H-P)+" L"+P+" "+(H-P)+" Z";
  var gid="g"+Math.random().toString(36).slice(2,7);
  return "<svg viewBox='0 0 "+W+" "+H+"' preserveAspectRatio='none'>"+
    "<defs><linearGradient id='"+gid+"' x1='0' y1='0' x2='0' y2='1'>"+
    "<stop offset='0' stop-color='"+color+"' stop-opacity='.28'/>"+
    "<stop offset='1' stop-color='"+color+"' stop-opacity='0'/></linearGradient></defs>"+
    "<path d='"+area+"' fill='url(#"+gid+")'/>"+
    "<path d='"+path+"' fill='none' stroke='"+color+"' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>"+
    "</svg>";
}
function lineChart(series, colors){
  // series: [{pts:[[ts,val]], color}] 共用时间轴（取所有序列的时间并集）
  var all=series.filter(function(s){return s.pts&&s.pts.length>1;});
  if(!all.length) return "<div class='empty' style='padding:16px 0'>数据不足</div>";
  var W=600,H=140,P=8;
  var ts0=Infinity, ts1=-Infinity, vs=[];
  all.forEach(function(s){ s.pts.forEach(function(p){ if(p[0]<ts0)ts0=p[0]; if(p[0]>ts1)ts1=p[0]; vs.push(p[1]); }); });
  var trange=(ts1-ts0)||1;
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  if(hi===lo) hi=lo+1;
  var range=hi-lo;
  var X=function(t){return P+((t-ts0)/trange)*(W-2*P);};
  var Y=function(v){return H-P-((v-lo)/range)*(H-2*P);};
  var paths=all.map(function(s){
    return "<path d='"+s.pts.map(function(p){return (p[0]===ts0?"M":"L")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1);}).join(" ")+
      "' fill='none' stroke='"+s.color+"' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>";
  }).join("");
  return "<svg viewBox='0 0 "+W+" "+H+"' preserveAspectRatio='none'>"+paths+"</svg>";
}
function fmtAxis(ts, hours){
  var d=new Date(ts*1000);
  if(hours<=24) return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return (d.getMonth()+1)+"/"+d.getDate();
}

      dItem("内存总量",humanBytes(m.mem_total))+dItem("硬盘总量",humanBytes(m.disk_total))+
      dItem("交换总量",humanBytes(m.swap_total))+dItem("Agent 版本",n.agent_version)+
      (price?dItem("价格",price+" "+cycleLabel(n.billing_cycle)):"")+

var PROBE_COLORS=["#2563eb","#7c3aed","#db2777"];
function fetchDetailPing(n,hours){
  api("/api/nodes/"+n.id+"/metrics?hours="+hours+"&points=180&series=ping").then(function(d){
    var box=document.getElementById("dlats"); if(!box) return;
    if(!d.ping||!d.ping.length){
      box.innerHTML="<div class='empty' style='padding:10px 0'>无探测数据</div>";
      var c0=document.getElementById("ch-lat"); if(c0) c0.innerHTML="<div class='empty' style='padding:16px 0'>无探测数据</div>";
      return;
    }
    var list=lastLatencyByProbe(d.ping, d.probes||state.probeNames);
    box.innerHTML=list.map(function(p,idx){
      var cls=p.latency==null?"none":(p.latency>=150?"bad":(p.latency>=80?"warn":""));
      var loss=(d.loss&&d.loss[p.task]!=null)?("丢包 "+Number(d.loss[p.task]).toFixed(1)+"%"):"";
      return "<div class='dlat-card'><div class='pn'><span class='ldot' style='background:"+PROBE_COLORS[idx%3]+"'></span>"+esc(p.name)+"</div>"+
        "<div class='pv "+cls+"'>"+(p.latency!=null?Math.round(p.latency)+" ms":"—")+"</div>"+
        (loss?"<div class='loss'>"+esc(loss)+"</div>":"")+"</div>";
    }).join("");
    // 延迟折线（每条线路一条）
    var chart=document.getElementById("ch-lat");
    if(chart){
      var series=list.map(function(p,i){
        return {pts:p.series.filter(function(r){return r.latency!=null;}).map(function(r){return [r.ts,r.latency];}),
                color:PROBE_COLORS[i%3]};
      });
      var ok=series.filter(function(s){return s.pts.length>1;});
      if(!ok.length){ chart.innerHTML="<div class='empty' style='padding:16px 0'>数据不足</div>"; }
      else{
        chart.innerHTML=lineChart(series);
        var cur=document.getElementById("cur-lat");
        if(cur) cur.textContent=list.map(function(p){return p.latency!=null?Math.round(p.latency)+"ms":"—";}).join(" / ");
        var t0=Infinity,t1=-Infinity;
        ok.forEach(function(s){ s.pts.forEach(function(p){ if(p[0]<t0)t0=p[0]; if(p[0]>t1)t1=p[0]; }); });
        var ax=document.getElementById("ax-lat");
        if(ax) ax.innerHTML="<span>"+fmtAxis(t0,hours)+"</span><span>"+fmtAxis(t1,hours)+"</span>";
        var leg=document.getElementById("leg-lat");
        if(leg) leg.innerHTML=list.map(function(p,i){return "<i><span class='ldot' style='background:"+PROBE_COLORS[i%3]+"'></span>"+esc(p.name)+"</i>";}).join("");
      }
    }
  }).catch(function(){
    var b=document.getElementById("dlats"); if(b) b.innerHTML="<div class='empty' style='padding:10px 0'>加载失败</div>";
    var c=document.getElementById("ch-lat"); if(c) c.innerHTML="<div class='empty' style='padding:16px 0'>加载失败</div>";
  });
}
function fetchDetailMetrics(n,hours){
  api("/api/nodes/"+n.id+"/metrics?hours="+hours+"&points=180&series=metrics").then(function(d){
    var rows=(d&&d.metrics)||[];
    var set=function(id,pts,color,fmt,axisId){
      var el=document.getElementById(id); if(!el) return;
      if(!pts||pts.length<2){ el.innerHTML="<div class='empty' style='padding:16px 0'>数据不足</div>"; return; }
      el.innerHTML=sparkline(pts,color);
      var cur=document.getElementById("cur-"+id.slice(3));
      if(cur) cur.textContent=fmt(pts[pts.length-1][1]);
      var ax=document.getElementById(axisId);
      if(ax&&pts.length){ ax.innerHTML="<span>"+fmtAxis(pts[0][0],hours)+"</span><span>"+fmtAxis(pts[pts.length-1][0],hours)+"</span>"; }
    };
    set("ch-cpu", rows.map(function(r){return [r.ts,r.cpu||0];}), "#2563eb", function(v){return Math.round(v)+"%";}, "ax-cpu");
    set("ch-mem", rows.map(function(r){return [r.ts,r.mem_used||0];}), "#7c3aed", function(v){return humanBytes(v);}, "ax-mem");
    set("ch-disk", rows.map(function(r){return [r.ts,r.disk_used||0];}), "#0891b2", function(v){return humanBytes(v);}, "ax-disk");
    // 网络双线
    var net=document.getElementById("ch-net");
    if(net){
      var rx=rows.map(function(r){return [r.ts,r.net_rx||0];});
      var tx=rows.map(function(r){return [r.ts,r.net_tx||0];});
      if(rx.length<2){ net.innerHTML="<div class='empty' style='padding:16px 0'>数据不足</div>"; }
      else{
        net.innerHTML=lineChart([{pts:rx,color:"#16a34a"},{pts:tx,color:"#d97706"}]);
        var cur=document.getElementById("cur-net");
        if(cur) cur.textContent="↓"+humanRate(rx[rx.length-1][1])+" ↑"+humanRate(tx[tx.length-1][1]);
        var ax=document.getElementById("ax-net");
        if(ax) ax.innerHTML="<span>"+fmtAxis(rx[0][0],hours)+"</span><span>"+fmtAxis(rx[rx.length-1][0],hours)+"</span>";
      }
    }
  }).catch(function(){
    ["ch-cpu","ch-mem","ch-disk","ch-net"].forEach(function(id){
      var el=document.getElementById(id); if(el) el.innerHTML="<div class='empty' style='padding:16px 0'>加载失败</div>";
    });
  });
}

/* ===== 数据层 ===== */
function api(path){
  return fetch(path,{headers:{accept:"application/json"}}).then(function(res){
    if(res.ok) return res.json();
    var ct=res.headers.get("content-type")||"";
    if(ct.indexOf("text/plain")>=0) return res.text().then(function(t){throw{hub:t};});
    throw{hub:res.status===401?"需要登录后查看":"请求失败（HTTP "+res.status+"）"};
  });
}
function loadConfig(){
  api("/api/themes/"+SHORT+"/config").then(function(cfg){
    state.notice=(cfg&&cfg.notice)?String(cfg.notice):"";renderNotice();
  }).catch(function(){state.notice="";});
}
function loadMe(){
  return api("/api/me").then(function(me){
    state.site=me.site_name||state.site||"节点监控";
    document.getElementById("site").textContent=state.site; document.title=state.site;
  }).catch(function(){});
}
function fetchLatencies(){
  var nodes=state.nodes.filter(function(n){return n.online}).slice(0,30);
  if(!nodes.length) return;
  Promise.all(nodes.map(function(n){
    return api("/api/nodes/"+n.id+"/metrics?hours=6&points=24&series=ping").then(function(d){
      if(d&&d.ping){ if(d.probes) state.probeNames=d.probes;
        state.probeLat[n.id]=lastLatencyByProbe(d.ping, d.probes||state.probeNames); }
    }).catch(function(){});
  })).then(function(){ renderCards(); });
}
function refreshNodes(){
  return api("/api/nodes").then(function(d){
    state.nodes=d.nodes||[]; state.err=""; showErr(""); renderAll(); fetchLatencies();
  }).catch(function(e){ state.err=(e&&e.hub)?e.hub:"网络异常，稍后重试"; showErr(state.err); });
}

/* ===== WebSocket（gzip 双帧 + 轮询兜底）===== */
var ws=null;
function wsUrl(){
  var s=location.protocol==="https:"?"wss":"ws";
  return s+"//"+location.host+"/api/ws"+(typeof DecompressionStream==="function"?"?gzip":"");
}
function frameText(data){
  if(typeof data==="string") return Promise.resolve(data);
  var plain=data.stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(plain).text();
}
function connectWS(){
  try{ ws=new WebSocket(wsUrl()); }catch(e){ return; }
  var decoded=Promise.resolve();
  ws.onmessage=function(ev){
    decoded=decoded.then(function(){
      return frameText(ev.data).then(function(txt){
        if(ws.readyState!==WebSocket.OPEN) return;
        var d=JSON.parse(txt);
        if(d.nodes){ state.nodes=d.nodes; state.wsLive=true; renderAll(); }
      });
    }).catch(function(){});
  };
  ws.onopen=function(){ state.wsLive=true; renderLive(); };
  ws.onclose=function(){ state.wsLive=false; renderLive(); startPoll(); };
  ws.onerror=function(){ if(ws){ try{ws.close();}catch(e){} } };
}
var pollTimer=null;
function startPoll(){
  if(pollTimer) return;
  pollTimer=setInterval(function(){ if(document.hidden||state.wsLive) return; refreshNodes(); },5000);
  setTimeout(function(){ if(!state.wsLive) connectWS(); },15000);
}
function stopAll(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} if(ws){try{ws.close();}catch(e){}} }

document.addEventListener("visibilitychange",function(){
  if(document.hidden){ stopAll(); return; }
  refreshNodes(); connectWS();
});
window.addEventListener("popstate",function(){
  var mm=location.pathname.match(/^\/node\/(\d+)/);
  if(mm){ state.view="detail"; state.detailId=Number(mm[1]); showView("detail"); renderDetail(); }
  else showList();
});

var MOON_SVG="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'/></svg>";
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  var btn=document.getElementById("themeBtn");
  if(btn){
    btn.innerHTML=(t==="dark")?SUN_SVG:MOON_SVG;
    var tip=(t==="dark")?"切换到浅色":"切换到深色";
    btn.title=tip; btn.setAttribute("aria-label",tip);

function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=(cur==="dark")?"light":"dark";
  try{ localStorage.setItem("theme",next); }catch(e){}
  setTheme(next);
}
function applyTheme(){
  var saved; try{saved=localStorage.getItem("theme")||"";}catch(e){}
  var dark=saved==="dark"||(!saved&&matchMedia("(prefers-color-scheme: dark)").matches);
  setTheme(dark?"dark":"light");
}

/* 启动 */
applyTheme();
loadConfig();
(function routeInit(){
  var mm=location.pathname.match(/^\/node\/(\d+)$/);
  if(mm){ state.view="detail"; state.detailId=Number(mm[1]); showView("detail"); renderDetail(); }
  else showView("list");
})();
loadMe().then(function(){ refreshNodes().then(connectWS); });
